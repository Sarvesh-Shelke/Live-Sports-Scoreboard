<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Sports Scoreboard</title>
<style>
  :root { --bg:#0f1b2d; --card:#1a2a44; --text:#eef2f7; --accent:#ffb703; --live:#e63946; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Segoe UI, Arial, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 1rem; text-align: center; background: #0a1322; }
  nav { display: flex; gap: .5rem; justify-content: center; flex-wrap: wrap; padding: .75rem; }
  nav button { padding: .5rem 1rem; border: 0; border-radius: 20px; cursor: pointer; background: var(--card); color: var(--text); }
  nav button.active { background: var(--accent); color: #000; }
  main { display: grid; gap: 1rem; padding: 1rem; grid-template-columns: 1fr; max-width: 1100px; margin: auto; }
  .match { background: var(--card); border-radius: 12px; padding: 1rem; text-align: center; }
  .teams { display: flex; justify-content: space-between; align-items: center; margin: .75rem 0; }
  .team { flex: 1; font-weight: 600; }
  .score { font-size: 2rem; font-weight: 700; color: var(--accent); min-width: 90px; }
  .status { font-size: .8rem; }
  .live { color: var(--live); font-weight: 700; }
  .controls button { margin: 0 .25rem; padding: .3rem .7rem; cursor: pointer; border-radius: 6px; border: 0; }
  @media (min-width: 600px)  { main { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 900px)  { main { grid-template-columns: repeat(3, 1fr); } .score { font-size: 2.4rem; } }
</style>
</head>
<body>
<header><h1>Live Sports Scoreboard</h1></header>
<nav id="filters"></nav>
<main id="board"></main>

<script>
// ---- Data (JS objects, arrays, data types) ----
const matches = [
  { id: 1, sport: "Football",   a: "Mumbai FC", b: "Goa United",  sa: 0, sb: 0, time: 0 },
  { id: 2, sport: "Cricket",    a: "India",     b: "Australia",   sa: 120, sb: 98, time: 0 },
  { id: 3, sport: "Basketball", a: "Lakers",    b: "Bulls",       sa: 54, sb: 51, time: 0 },
  { id: 4, sport: "Football",   a: "Pune City", b: "Delhi Dynamos", sa: 1, sb: 2, time: 0 },
  { id: 5, sport: "Cricket",    a: "England",   b: "Pakistan",    sa: 210, sb: 205, time: 0 },
  { id: 6, sport: "Basketball", a: "Celtics",   b: "Heat",        sa: 77, sb: 80, time: 0 }
];
let currentFilter = "All";

// ---- Functions & closures ----
function makeScorer(match, side) {            // closure keeps match & side
  return function (points) {
    match[side] += points;
    render();
  };
}
const increments = { Football: 1, Cricket: 4, Basketball: 2 };

// ---- DOM manipulation ----
function render() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  matches
    .filter(m => currentFilter === "All" || m.sport === currentFilter)
    .forEach(m => {
      const card = document.createElement("div");
      card.className = "match";
      card.innerHTML = `
        <div class="status"><span class="live">● LIVE</span> | ${m.sport} | ${m.time} min</div>
        <div class="teams">
          <div class="team">${m.a}</div>
          <div class="score">${m.sa} - ${m.sb}</div>
          <div class="team">${m.b}</div>
        </div>`;
      const ctrl = document.createElement("div");
      ctrl.className = "controls";
      [["a", m.a], ["b", m.b]].forEach(([side, name]) => {
        const btn = document.createElement("button");
        btn.textContent = "+" + increments[m.sport] + " " + name;
        const key = side === "a" ? "sa" : "sb";
        btn.addEventListener("click", () => makeScorer(m, key)(increments[m.sport])); // event handling
        ctrl.appendChild(btn);
      });
      card.appendChild(ctrl);
      board.appendChild(card);
    });
}

function renderFilters() {
  const nav = document.getElementById("filters");
  ["All", "Football", "Cricket", "Basketball"].forEach(s => {
    const b = document.createElement("button");
    b.textContent = s;
    b.className = s === currentFilter ? "active" : "";
    b.onclick = () => {
      currentFilter = s;
      nav.querySelectorAll("button").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      render();
    };
    nav.appendChild(b);
  });
}

// ---- Simulated live updates ----
setInterval(() => {
  matches.forEach(m => {
    m.time += 1;
    if (Math.random() < 0.3) m[Math.random() < 0.5 ? "sa" : "sb"] += increments[m.sport];
  });
  render();
}, 3000);

renderFilters();
render();
</script>
</body>
</html>
